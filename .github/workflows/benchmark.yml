name: Performance Nightly

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Escenario de presupuestos a ejecutar"
        type: choice
        default: synthetic-cpu-320x240
        options:
          - synthetic-cpu-320x240
          - synthetic-cpu-640x480
      device:
        description: "Dispositivo declarado del runner"
        type: choice
        default: cpu
        options:
          - cpu
      strict:
        description: "Fallar el job si se supera un presupuesto"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  SCENARIO: ${{ inputs.scenario || 'synthetic-cpu-320x240' }}
  DEVICE: ${{ inputs.device || 'cpu' }}
  STRICT: ${{ github.event_name == 'schedule' && 'true' || inputs.strict }}

jobs:
  benchmark:
    name: Benchmark con video sintético
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cpu.txt
            requirements-dev.txt

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip check

      - name: Validar escenario del runner estándar
        run: |
          if [ "$SCENARIO" = "synthetic-gpu-640x480" ] || [ "$DEVICE" = "gpu" ]; then
            echo "El escenario GPU requiere un runner CUDA; ejecútalo localmente con benchmark_nightly." >&2
            exit 1
          fi

      - name: Generar video sintético fijado
        run: |
          WIDTH=320
          HEIGHT=240
          if [ "$SCENARIO" = "synthetic-cpu-640x480" ]; then
            WIDTH=640
            HEIGHT=480
          fi
          python -m vision_core.scripts.create_benchmark_video benchmark-data/$SCENARIO \
            --frames 450 --fps 15 --width "$WIDTH" --height "$HEIGHT" --allow-existing

      - name: Ejecutar benchmark y comparar contra baseline
        run: |
          set -o pipefail
          BASELINE_ARGS=""
          if [ -f "benchmarks/baseline-$SCENARIO.json" ]; then
            BASELINE_ARGS="--baseline benchmarks/baseline-$SCENARIO.json --fail-on-regression"
          fi
          STRICT_ARGS=""
          if [ "$STRICT" = "true" ]; then
            STRICT_ARGS="--fail-on-budget"
          fi
          python -m vision_core.scripts.benchmark_nightly \
            --scenario "$SCENARIO" \
            --video "benchmark-data/$SCENARIO/benchmark.avi" \
            --zones "benchmark-data/$SCENARIO/zones.json" \
            --scene "benchmark-data/$SCENARIO/scene.json" \
            --budgets benchmarks/budgets.json \
            --device "$DEVICE" \
            --output "benchmark-$SCENARIO.json" \
            --csv "benchmark-$SCENARIO.csv" \
            --summary "benchmark-$SCENARIO.md" \
            $BASELINE_ARGS $STRICT_ARGS 2>&1 | tee benchmark-nightly.log

      - name: Publicar resumen del job
        if: always()
        run: |
          if [ -f "benchmark-$SCENARIO.md" ]; then
            cat "benchmark-$SCENARIO.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefactos del benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-*.json
            benchmark-*.csv
            benchmark-*.md
            benchmark-nightly.log
            benchmark-data/*/profiling.json
          if-no-files-found: warn
