[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-core"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vision_core.infrastructure.monitor" = ["index.html"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: pruebas e2e pesadas; se ejecutan en nightly o workflow manual",
]

[tool.coverage.run]
branch = true
source = ["vision_core"]
omit = ["*/scripts/*"]

[tool.coverage.report]
show_missing = true
precision = 1

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "."]
exclude = [".venv", "third_party", "__pycache__", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"] # Errores, Pyflakes, Warnings, Isort (imports)
ignore = []
