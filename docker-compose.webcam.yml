# Linux: docker compose -f docker-compose.yml -f docker-compose.webcam.yml up -d frigate
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "256mb"
    devices:
      - ${FRIGATE_WEBCAM_DEVICE:-/dev/video0}:/dev/video0
    ports:
      - "127.0.0.1:15000:5000"
      - "127.0.0.1:28554:8554"
    volumes:
      - ./config/frigate-local:/config
    tmpfs:
      - /tmp/cache:size=256m
      - /media/frigate:size=256m
  vision-core:
    environment:
      VISION_CORE_RTSP_URL: rtsp://frigate:8554/entrada
    depends_on:
      frigate:
        condition: service_healthy
