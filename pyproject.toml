[project]
name = "vision-core"
version = "0.1.0"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vision_core*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".venv", "third_party", "__pycache__", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"] # Errores, Pyflakes, Warnings, Isort (imports)
ignore = []
