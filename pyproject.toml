[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-core"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vision_core.infrastructure.monitor" = ["index.html"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "."]
exclude = [".venv", "third_party", "__pycache__", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"] # Errores, Pyflakes, Warnings, Isort (imports)
ignore = []
