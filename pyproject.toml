[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-core"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vision_core.features.monitor.infrastructure.http" = ["index.html"]

[tool.setuptools.data-files]
"config" = ["config/models.yml"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: pruebas e2e pesadas; se ejecutan en nightly o workflow manual",
    "smoke: prueba de humo de rendimiento con umbral amplio en cada PR",
    "integration: prueba de integración del pipeline con video sintético",
    "e2e: prueba de punta a punta del monitor con servidor HTTP local",
    "performance: análisis de presupuestos, regresiones y generador sintético",
]

[tool.coverage.run]
branch = true
source = ["vision_core"]
omit = ["*/scripts/*"]

[tool.coverage.report]
show_missing = true
precision = 1

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "."]
exclude = [".venv", "third_party", "__pycache__", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"] # Errores, Pyflakes, Warnings, Isort (imports)
ignore = []

[tool.mypy]
python_version = "3.11"
files = ["src", "main.py"]
# Los scripts Python viven en src/vision_core/scripts y quedan cubiertos por "src".
mypy_path = "src"
exclude = [
    "\\.venv",
    "third_party",
    "__pycache__",
    "\\.git",
    "build",
    "dist",
]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true # Dependencias sin stubs; se documenta en docs/type-checking.md
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true
pretty = true
