name: CI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src

jobs:
  tests:
    name: Unit + Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cpu.txt
            requirements-dev.txt

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip check

      - name: Ejecutar unitarias + integración con cobertura
        run: |
          set -o pipefail
          python -m pytest -q -m "not slow" \
            --cov=vision_core --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-report=html:htmlcov \
            --cov-fail-under=80 2>&1 | tee pytest-pr.log

      - name: Verificar umbrales por módulo
        run: python -m vision_core.scripts.check_coverage coverage.json

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pr
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          if-no-files-found: warn

      - name: Subir logs de fallo
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-pr-logs
          path: pytest-pr.log
          if-no-files-found: warn

  smoke:
    name: Performance Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cpu.txt
            requirements-dev.txt

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip check

      - name: Ejecutar smoke de rendimiento
        env:
          VISION_CORE_SMOKE_REPORT: performance-smoke.json
        run: |
          set -o pipefail
          python -m pytest -q -m smoke 2>&1 | tee pytest-smoke.log

      - name: Publicar resumen del smoke
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path("performance-smoke.json")
          if report.is_file():
              metrics = json.loads(report.read_text(encoding="utf-8"))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Smoke de rendimiento\n\n")
                  summary.write(f"- FPS: {metrics['fps']:.2f}\n")
                  summary.write(f"- Frame p95: {metrics['frame_p95_ms']:.2f} ms\n")
                  summary.write(f"- Memoria pico: {metrics['memory_peak_mb']:.2f} MB\n")
          PY

      - name: Subir artefactos del smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke
          path: |
            performance-smoke.json
            pytest-smoke.log
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verificar compilación
        run: python -m compileall -q src tests main.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar Ruff
        run: python -m pip install ruff==0.3.0

      - name: Ejecutar Ruff
        run: make lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de tipos
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Ejecutar mypy
        run: python -m mypy
