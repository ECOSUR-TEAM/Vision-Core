[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-core"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vision_core.infrastructure.monitor" = ["index.html"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "."]
exclude = [".venv", "third_party", "__pycache__", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"] # Errores, Pyflakes, Warnings, Isort (imports)
ignore = []

[tool.mypy]
python_version = "3.10"
files = ["src", "main.py"]
# Los scripts Python viven en src/vision_core/scripts y quedan cubiertos por "src".
mypy_path = "src"
exclude = [
    "\\.venv",
    "third_party",
    "__pycache__",
    "\\.git",
    "build",
    "dist",
]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true # Dependencias sin stubs; se documenta en docs/type-checking.md
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true
pretty = true
