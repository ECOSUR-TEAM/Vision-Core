name: CI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src

jobs:
  tests:
    name: Unit + Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cpu.txt
            requirements-dev.txt

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip check

      - name: Ejecutar unitarias + integración con cobertura
        run: |
          set -o pipefail
          python -m pytest -q -m "not slow" \
            --cov=vision_core --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-report=html:htmlcov \
            --cov-fail-under=80 2>&1 | tee pytest-pr.log

      - name: Verificar umbrales por módulo
        run: python -m vision_core.scripts.check_coverage coverage.json

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pr
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          if-no-files-found: warn

      - name: Subir logs de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-pr-logs
          path: pytest-pr.log
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verificar compilación
        run: python -m compileall -q src tests main.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar Ruff
        run: python -m pip install ruff==0.3.0

      - name: Ejecutar Ruff
        run: make lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de tipos
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Ejecutar mypy
        run: python -m mypy
