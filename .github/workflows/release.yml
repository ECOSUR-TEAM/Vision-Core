name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Validate tag and CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate SemVer tag
        shell: bash
        run: |
          python - <<'PY'
          import re
          import tomllib
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          semver = re.compile(
              r"^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$"
          )
          match = semver.fullmatch(tag)
          if not match:
              raise SystemExit(f"Invalid SemVer tag: {tag}")
          with open("pyproject.toml", "rb") as source:
              project_version = tomllib.load(source)["project"]["version"]
          base = ".".join(match.group(1, 2, 3))
          if base != project_version:
              raise SystemExit(
                  f"Tag base version {base} does not match pyproject.toml version {project_version}"
              )
          print(f"Validated {tag}")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src tests main.py

      - name: Run tests
        run: python -m pytest -q

      - name: Install and run Ruff
        run: |
          python -m pip install ruff==0.3.0
          ruff check .
          ruff format --check .

  build-and-push:
    name: Build ${{ matrix.target }}
    needs: validate-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        target: [runtime, camera-bridge]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tags
        id: tags
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          repository="${GITHUB_REPOSITORY,,}"
          if [ "${{ matrix.target }}" = "camera-bridge" ]; then
            image="ghcr.io/${repository}-camera-bridge"
          else
            image="ghcr.io/${repository}"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tags="$image:$version"
          if [[ "$version" != *-* ]]; then
            tags="$tags"$'\n'"$image:latest"
          fi
          printf 'tags<<EOF\n%s\nEOF\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}

      - name: Save digest
        shell: bash
        run: |
          mkdir -p digests
          printf '%s@%s\n' "${{ steps.tags.outputs.image }}" "${{ steps.build.outputs.digest }}" \
            > "digests/${{ matrix.target }}.txt"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digest-${{ matrix.target }}
          path: digests/${{ matrix.target }}.txt
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Generate release notes
        shell: bash
        run: |
          python scripts/extract_changelog.py "${GITHUB_REF_NAME#v}" CHANGELOG.md > changelog-section.md
          {
            echo "# $GITHUB_REF_NAME"
            echo
            echo "## Image digests"
            echo
            echo '```text'
            cat digests/*.txt
            echo '```'
            echo
            cat changelog-section.md
          } > release-notes.md
          cat digests/*.txt > release-digests.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --notes-file release-notes.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            release-digests.txt
