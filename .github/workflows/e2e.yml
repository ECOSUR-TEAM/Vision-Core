name: E2E Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E con video sintético
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip check

      - name: Ejecutar e2e pesado
        env:
          G0_PROFILING_ARTIFACT: profiling_results.json
        run: |
          set -o pipefail
          python -m pytest -q -m slow 2>&1 | tee pytest-e2e.log

      - name: Subir baseline G0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g0-profiling
          path: profiling_results.json
          if-no-files-found: warn

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-e2e-logs
          path: pytest-e2e.log
          if-no-files-found: warn
